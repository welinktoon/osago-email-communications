  <title>Закрытый просмотр</title>
  <style>
    :root { color-scheme:light; --ink:#101828; --muted:#667085; --line:#dfe4ec; --red:#ef3124; --bg:#f5f7fb; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--ink); font:15px/1.45 Arial,Helvetica,sans-serif; }
    .access-card { width:min(100%,420px); padding:38px 38px 34px; border:1px solid #e7eaf0; border-radius:30px; background:#fff; box-shadow:0 24px 70px rgba(16,24,40,.10); text-align:center; }
    .lock-mark { width:58px; height:58px; margin:0 auto 22px; display:grid; place-items:center; border-radius:19px; background:#fff0ef; color:var(--red); }
    .lock-mark svg { width:29px; height:29px; }
    h1 { margin:0; font-size:27px; line-height:1.16; letter-spacing:-.45px; }
    .lead { margin:11px auto 25px; max-width:290px; color:var(--muted); }
    label { display:block; margin-bottom:8px; text-align:left; font-size:13px; font-weight:700; color:#344054; }
    input { width:100%; height:56px; border:1px solid var(--line); border-radius:16px; padding:0 18px; background:#fff; color:var(--ink); font:700 23px/1 Arial,Helvetica,sans-serif; text-align:center; letter-spacing:10px; caret-color:var(--red); outline:none; transition:border-color .2s,box-shadow .2s; }
    input:focus { border-color:#ef8179; box-shadow:0 0 0 4px #fee4e2; }
    button { width:100%; min-height:52px; margin-top:13px; border:0; border-radius:16px; background:var(--red); color:#fff; font:700 15px/1 Arial,Helvetica,sans-serif; cursor:pointer; transition:background .2s,transform .15s; }
    button:hover { background:#dc2f27; }
    button:active { transform:translateY(1px); }
    button:disabled { cursor:wait; opacity:.72; }
    .status { min-height:21px; margin:10px 0 0; color:#d92d20; font-size:13px; }
    .privacy { margin:15px 0 0; color:#98a2b3; font-size:11px; }
    .shake { animation:shake .32s ease; }
    @keyframes shake { 25% { transform:translateX(-5px); } 50% { transform:translateX(5px); } 75% { transform:translateX(-3px); } }
    @media(max-width:480px) { .access-card { padding:31px 23px 28px; border-radius:25px; } h1 { font-size:24px; } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }
  </style>
</head>

    const form=document.getElementById('access-form');
    const input=document.getElementById('access-code');
    const button=document.getElementById('access-submit');
    const status=document.getElementById('access-status');
    const card=document.getElementById('access-card');
    const decode=value=>Uint8Array.from(atob(value),character=>character.charCodeAt(0));

    async function decryptPage(password){
      const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
      const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
      const result=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(payload.iv)},key,decode(payload.data));
      return new TextDecoder().decode(result);
    }

    form.addEventListener('submit',async event=>{
      event.preventDefault();
      const password=input.value.trim();
      if(password.length!==4){ status.textContent='Введите четыре цифры.'; input.focus(); return; }
      button.disabled=true;
      button.textContent='Проверяем…';
      status.textContent='';
      try{
        const html=await decryptPage(password);
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        status.textContent='Неверный код. Попробуйте ещё раз.';
        input.value='';
        input.focus();
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
        button.disabled=false;
        button.textContent='Открыть прототип';
      }
    });
